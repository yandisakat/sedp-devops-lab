apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-app
  namespace: lab
  labels:
    app.kubernetes.io/name: lab-app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # start one new pod before stopping an old one
      maxUnavailable: 0  # never drop below the desired count
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab-app
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: app
          image: lab-app:1.0.0
          imagePullPolicy: IfNotPresent   # image is loaded into kind, not pulled
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_VERSION
              value: "1.0.0"
          envFrom:
            - configMapRef:
                name: lab-app
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 256Mi }
          startupProbe:          # allow up to 60s to boot before liveness starts
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:         # restart the container if it stops answering
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:        # only send traffic once /readyz says ready
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
          lifecycle:
            preStop:             # let the Service stop routing here before exit
              exec: { command: ["sleep", "5"] }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
