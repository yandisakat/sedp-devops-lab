# Argo CD Application for the prod environment.
# Apply: kubectl apply -f gitops/argocd/lab-app-prod.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yandisakat/sedp-devops-lab.git
    targetRevision: main          # environment branch, like ADSS
    path: charts/lab-app
    helm:
      releaseName: lab-app
      valueFiles:
        - ../../gitops/envs/prod/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-prod
  syncPolicy:
    automated:
      prune: true      # delete what git no longer declares
      selfHeal: true   # undo manual changes in the cluster
    syncOptions:
      - CreateNamespace=true
