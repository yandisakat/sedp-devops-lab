# Lab-sized kube-prometheus-stack. Picks up ServiceMonitors and PrometheusRules
# from every namespace, not only ones labelled for this Helm release.
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 2d
grafana:
  adminPassword: admin        # local lab only
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL    # loads ConfigMaps labelled grafana_dashboard=1
