# Lets workflow pods in the argo namespace report their status back to the controller.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-ci
  namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-ci
  namespace: argo
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-ci
  namespace: argo
subjects:
  - kind: ServiceAccount
    name: lab-ci
    namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-ci
